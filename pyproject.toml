[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dynamic-sam"
version = "1.0"
description = "DynamicSAM: interactive 3D point cloud segmentation with adaptive masking and fine-grained version control"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Maral Bahari", email = "maralbahari.98@gmail.com" },
]
keywords = [
    "Interactive Segmentation",
    "3D Vision",
    "Segmentation",
    "Promptable Segmentation",
]

# Shared by both the training and inference paths: torch/triton back the
# model and the Triton kernels in src/kernel; timm and termcolor are pulled
# in transitively by src/models (PointCloudEncoder, src/models/utils/logger.py).
# setuptools is required at runtime by triton's backend auto-discovery.
dependencies = [
    "torch==2.6.0",
    "torchvision==0.21.0",
    "triton==3.2.0",
    "numpy==2.2.6",
    "timm==1.0.28",
    "termcolor==3.3.0",
    "setuptools>=68",
]

[project.optional-dependencies]
# Everything the `dynamic-sam serve` CLI command (src/cli, src/serve) needs
# beyond the base dependencies.
inference = [
    "fastapi==0.141.1",
    "uvicorn==0.52.4",
    "pydantic==2.13.4",
    "click==8.4.2",
    "safetensors==0.8.0",
    "huggingface_hub==1.28.0",
]
# Everything the `dynamic-sam train`/`dynamic-sam test` CLI commands
# (src/cli, src/task/cli.py) / the Lightning training and data pipeline need
# beyond the base dependencies. jsonargparse[signatures] is required by
# lightning.pytorch.cli.LightningCLI but not pulled in by lightning itself.
training = [
    "lightning==2.6.5",
    "jsonargparse[signatures]>=4.27.7",
    "pandas==2.3.3",
    "scipy==1.15.3",
    "open3d==0.19.0",
    "tensorboard==2.21.0",
    "plyfile==1.1.5",
    "tqdm==4.70.0",
]

# Only needed to run the test suite (tests/). httpx backs fastapi.testclient,
# used by tests/test_serve_sessions.py; it's currently only pulled in
# transitively (via timm -> huggingface-hub), so pin it explicitly rather
# than rely on that.
dev = [
    "pytest==9.1.1",
    "httpx==0.28.1",
]

[project.urls]
Repository = "https://github.com/DESRLab/dynamic-sam.git"

[project.scripts]
dynamic-sam = "src.cli:cli"

[tool.setuptools]
packages = [
    "src.models",
    "src.models.utils",
    "src.task",
    "src.task.utils",
    "src.datasets.data_modules",
    "src.datasets.dataops",
    "src.datasets.utils",
    "src.kernel",
    "src.serve",
    "src.cli",
]
